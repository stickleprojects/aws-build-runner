AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  build-runner-artifacts: a private bucket for the build-runner Lambda zips (deploy.sh uploads them;
  Lambda copies the code at deploy time, so old zips expire after 30 days).
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]
      PublicAccessBlockConfiguration:
        {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      LifecycleConfiguration:
        Rules: [{Id: expire-old-zips, Status: Enabled, ExpirationInDays: 30,
                 AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}}]
      Tags: [{Key: resource-group, Value: build-runner}]
  TlsOnly:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource: [!GetAtt Bucket.Arn, !Sub "${Bucket.Arn}/*"]
            Condition: {Bool: {"aws:SecureTransport": "false"}}
Outputs:
  Bucket:
    Value: !Ref Bucket
