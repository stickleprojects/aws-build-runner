# What Claude's IAM user may do in AWS. The ONE source of truth.
#
# Everything not granted here is denied, because nothing else grants it.
# build-policies.py turns this file into the IAM policies (out/*.json) and the
# plain-English summary (POLICY.md). Don't edit either output by hand.
#
# Changing it (see README.md, "Change process"):
#   1. Claude proposes the change and adds it here with  approved: pending
#   2. python3 -I build-policies.py --draft   and   ./verify.py --local   (draft POLICY.md + tests)
#   3. Kieron reads the POLICY.md diff; approves by setting  approved: YYYY-MM-DD Kieron
#   4. godmode: ./apply.sh EMAIL   (refuses while anything is pending)

# The account id and IAM user name are not in this (public) repo: see config.py.
region: ap-southeast-2
region_name: Sydney

# Services Claude may create, change and delete things with, in Sydney only.
# actions:  IAM action patterns granted.
# probe:    one action the tests expect to be allowed (in Sydney) and denied (elsewhere).
# blocked:  actions inside the service that stay denied, with the reason.
services:
  - id: ec2
    title: EC2 and VPC
    use: Build machines, AMIs, snapshots, volumes, launch templates; VPCs, subnets, security groups, internet gateways
    approved: 2026-11-16 Kieron
    actions: ["ec2:*"]
    probe: ec2:CreateSecurityGroup
    limits:
      instance_types: ["t3.*", "t3a.*", "t4g.*", "m*.large", "m*.xlarge", "c*.large", "c*.xlarge"]
      max_volume_gib: 256
      blocked_volume_types: [io1, io2]
      # gp3 performance above the free baseline is billed every month the disk exists (#30)
      max_gp3_iops: 3000
      max_gp3_throughput_mibps: 125
      shared_tenancy_only: true
    blocked:
      "ec2:CreateNatGateway": NAT gateway (≈US$45/month each, plus data)
      "ec2:CreateTransitGateway": Transit gateway (≈US$50/month per attachment)
      "ec2:CreateVpnConnection": Site-to-site VPN (≈US$36/month)
      "ec2:CreateClientVpnEndpoint": Client VPN (≈US$73/month per subnet)
      "ec2:CreateVerifiedAccess*": Verified Access (≈US$200/month per app)
      "ec2:EnableFastSnapshotRestores": Fast snapshot restore (≈US$650/month per snapshot per zone)
      "ec2:Purchase*": Reserved instances, capacity blocks, host reservations (long commitments)
      "ec2:ModifyReservedInstances": Reserved instance changes
      "ec2:AcceptReservedInstancesExchangeQuote": Reserved instance exchanges
      "ec2:AllocateHosts": Dedicated hosts
      "ec2:CreateCapacityReservation*": Capacity reservations (billed whether used or not)
      "ec2:CreateFleet": EC2 Fleet (launches many instances in one call, skipping the type limits)
      "ec2:RequestSpotFleet": Spot Fleet (same)
      "ec2:RequestSpotInstances": Legacy spot requests (spot goes through RunInstances instead)
      "ec2:DisableImageBlockPublicAccess": Making AMIs public
      "ec2:DisableSnapshotBlockPublicAccess": Making EBS snapshots public
      "ec2:DisableEbsEncryptionByDefault": Turning off disk encryption by default
      "ec2:LockSnapshot": Locking a snapshot (locked, it can't be deleted, so it bills until the lock ends, and the kill switch can't remove it)
      "ec2:EnableImageDeregistrationProtection": Protecting an AMI from deletion (the kill switch couldn't remove it)

  - id: ssm
    title: Systems Manager
    use: Parameters and secrets (Parameter Store), Session Manager shell into instances, Run Command
    approved: 2026-11-16 Kieron
    actions: ["ssm:*", "ssmmessages:*", "ec2messages:*"]
    probe: ssm:PutParameter

  - id: lambda
    title: Lambda
    use: The runner webhook and the reaper that removes stray instances
    approved: 2026-11-16 Kieron
    actions: ["lambda:*"]
    probe: lambda:CreateFunction
    blocked:
      "lambda:PutProvisionedConcurrencyConfig": Provisioned concurrency (billed around the clock)

  - id: events
    title: EventBridge and Scheduler
    use: Scheduled jobs (the reaper), event rules
    approved: 2026-11-16 Kieron
    actions: ["events:*", "scheduler:*"]
    probe: scheduler:CreateSchedule

  - id: logs
    title: CloudWatch Logs and metrics
    use: Logs from Lambda and the runner instances; metrics and alarms
    approved: 2026-11-16 Kieron
    actions: ["logs:*", "cloudwatch:*"]
    probe: logs:CreateLogGroup

  - id: s3
    title: S3
    use: Lambda code and template packages, build artifacts
    approved: 2026-11-16 Kieron
    actions: ["s3:*"]
    probe: s3:CreateBucket
    blocked:
      "s3:PutAccountPublicAccessBlock": Turning off the account-wide public access block
      "s3:PutBucketObjectLockConfiguration": Object lock (locked data can't be deleted, so it is billed until the lock ends)

  - id: cloudformation
    title: CloudFormation
    use: Deploying and tearing down stacks (runs with Claude's own rights, so the same limits apply)
    approved: 2026-11-16 Kieron
    actions: ["cloudformation:*"]
    probe: cloudformation:CreateStack

  - id: resource-groups
    title: Resource Groups
    use: One saved tag search per approved resource group, to see everything in it (free)
    approved: 2026-11-16 Kieron
    actions: ["resource-groups:*"]
    probe: resource-groups:CreateGroup

  - id: kms
    title: KMS, through other services only
    use: Encrypted disks, SecureString parameters, encrypted S3 objects and Lambda settings, all with AWS-managed keys. No creating keys
    approved: 2026-11-16 Kieron
    actions: ["kms:Decrypt", "kms:Encrypt", "kms:GenerateDataKey*", "kms:ReEncrypt*", "kms:DescribeKey", "kms:CreateGrant"]
    via_services: [ec2, ssm, s3, lambda]
    probe: kms:Decrypt

# Services that aren't regional (IAM, STS, billing). Read or narrow rights only.
global:
  - id: identity
    title: Who am I
    approved: 2026-11-16 Kieron
    actions: ["sts:GetCallerIdentity"]
  - id: billing
    title: Costs and prices, read only
    use: Checking spend, budgets and prices before suggesting anything
    approved: 2026-11-16 Kieron
    actions: ["budgets:View*", "budgets:Describe*", "ce:Get*", "ce:Describe*", "ce:List*", "pricing:*"]

# Read-only: listing and metadata, no data, no changes. Sydney only, like everything else.
# IAM is the exception: it has no regions (AWS evaluates every IAM request as us-east-1), so a
# Sydney condition would block IAM reads altogether.
read_only:
  approved: 2026-11-16 Kieron
  home_region:
    - "ec2:Describe*"
    - "lambda:List*"
    - "lambda:GetFunction*"
    - "cloudformation:Describe*"
    - "cloudformation:List*"
    - "s3:ListAllMyBuckets"
    - "s3:GetBucketLocation"
    - "s3:GetBucketTagging"
    - "tag:GetResources"
    - "tag:GetTagKeys"
    - "tag:GetTagValues"
    - "logs:DescribeLogGroups"
    - "cloudtrail:LookupEvents"
    - "servicequotas:Get*"
    - "servicequotas:List*"
    - "access-analyzer:ValidatePolicy"
    - "access-analyzer:CheckNoNewAccess"
    - "access-analyzer:CheckAccessNotGranted"
    - "access-analyzer:CheckNoPublicAccess"
  global:
    - "iam:Get*"
    - "iam:List*"
    - "iam:GenerateServiceLastAccessedDetails"
    - "iam:SimulatePrincipalPolicy"
    - "iam:SimulateCustomPolicy"

# Permissions for what Claude builds: roles, policies, instance profiles.
iam:
  approved: 2026-11-16 Kieron
  path: /claude/
  boundary: guardrails/claude-boundary
  pass_roles_to: [ec2.amazonaws.com, lambda.amazonaws.com, scheduler.amazonaws.com, events.amazonaws.com, cloudformation.amazonaws.com]
  service_linked_roles: [spot.amazonaws.com]

# Every resource Claude creates belongs to a resource group: the tag below, with an approved value.
# AWS has no Azure-style containers, so a "resource group" is this tag plus an AWS Resource Group
# (a saved tag search) of the same name, so the console can show everything in it.
resource_groups:
  approved: 2026-11-16 Kieron
  tag_key: resource-group
  groups:
    build-runner: The on-demand GitHub runner for spellbound3d (part 2)
  # Creates that accept tags at creation; each is denied unless it carries an approved group.
  # Grouped by resource scope: EC2 creates are scoped to the types they make (instance, volume…),
  # because the existing resources they also touch (a VPC, a source volume) carry no request tag.
  # A group never mixes an action with a type that action only touches. "*" = non-EC2 services.
  # Not enforced at creation, because AWS doesn't accept tags there or they touch an existing VPC:
  # S3 buckets, SSM parameter updates, EventBridge rules and schedules, VPCs/subnets/route tables/
  # gateways. They get the tag from their CloudFormation stack's tags instead.
  enforced_on:
    - actions: ["ec2:RunInstances", "ec2:CreateVolume"]
      resources: [instance, volume]
    - actions: ["ec2:CreateSnapshot", "ec2:CreateImage", "ec2:CreateLaunchTemplate", "ec2:CreateSecurityGroup"]
      resources: [snapshot, image, launch-template, security-group]
    - actions: ["lambda:CreateFunction", "logs:CreateLogGroup", "cloudformation:CreateStack",
                "iam:CreateRole", "iam:CreatePolicy", "iam:CreateInstanceProfile"]
      resources: "*"
  # Tag and untag actions guarded so the tag can't be removed or set to an unapproved group.
  tag_actions: ["ec2:CreateTags", "lambda:TagResource", "logs:TagResource", "logs:TagLogGroup",
                "cloudformation:TagResource", "iam:TagRole", "iam:TagPolicy", "iam:TagInstanceProfile"]
  untag_actions: ["ec2:DeleteTags", "lambda:UntagResource", "logs:UntagResource", "logs:UntagLogGroup",
                  "cloudformation:UntagResource", "iam:UntagRole", "iam:UntagPolicy", "iam:UntagInstanceProfile"]

# Specific resources that Claude, and every role it creates, may not touch, whatever the approved
# services allow. Each becomes an explicit deny in the policy and the boundary.
protected:
  approved: 2026-11-16 Kieron
  resources:
    - name: The budget kill switch
      why: Claude mustn't be able to change, disable or remove the automatic stop
      actions: ["lambda:*"]
      arn: "arn:aws:lambda:*:{{ACCOUNT_ID}}:function:guardrail-*"
    - name: The fast-stop alarms
      why: Claude mustn't be able to change, mute, fake or delete the alarms that stop fast spending (#30)
      actions: ["cloudwatch:PutMetricAlarm", "cloudwatch:DeleteAlarms", "cloudwatch:DisableAlarmActions",
                "cloudwatch:SetAlarmState", "cloudwatch:TagResource", "cloudwatch:UntagResource"]
      arn: "arn:aws:cloudwatch:*:{{ACCOUNT_ID}}:alarm:guardrail-*"

# Applied by apply.sh (godmode), outside the policy. Claude can't change them.
account_settings:
  # Kieron's ceiling is a bill of at most £30 (≈US$38). AWS bills in US$ and its billing data lags by
  # 8-36 hours, so the stop fires at US$29 (≈£23, Kieron 2026-11-17; the budget counts tax), leaving ≈£7 for
  # the lag and anything still billing. The fast stop below doesn't wait for billing data at all (#30).
  # A busy month of runners is ≈US$24-25, so it fits under the stop.
  budget_usd: 29
  # The budget counts everything in the account (every service: instances, logs, snapshots, data transfer…),
  # as what would be BILLED: credits reduce it (AWS applies them on the invoice, so covered usage is never
  # charged), refunds don't (they come back later, if at all), tax counts. Set by apply.sh and
  # bootstrap-budget-stop.sh.
  budget_counts_billed: true
  # Automatic stop at this % of ACTUAL spend (godmode: bootstrap-budget-stop.sh; rerun when roles change):
  #  - AWS Budgets attaches guardrails/budget-stop (nothing new and billable) to Claude's user and these
  #    /claude/ roles (ones that don't exist yet are skipped)
  #  - the kill switch (Lambda guardrail-kill-switch, Sydney) stops what's already spending
  budget_stop:
    at_percent: 100
    roles: [build-runner-bake, build-runner-ami-ci, build-runner-launcher]
    kill_switch:
      terminate_instances: true      # every instance in the account, and open spot requests
      delete_runner_amis: true       # resource-group=build-runner AMIs and snapshots (the pipeline rebuilds them)
      throttle_lambdas: true         # our Lambdas (tagged resource-group) get 0 concurrency: nothing runs, nothing bills
      delete_detached_volumes: true  # unattached disks tagged resource-group (a runner's disk goes with it anyway)
      release_unused_addresses: true # Elastic IPs not attached to anything (≈US$3.60/month each)
      delete_interface_endpoints: true  # interface VPC endpoints (≈US$29/month each); gateway endpoints are free
    # Fast stop, without waiting for billing data (#30): CloudWatch alarms, Sydney, each over 2 periods of 5
    # minutes in a row (so ≈10 minutes), trigger the kill switch in "fast" mode: it terminates every instance,
    # cancels spot requests and throttles our Lambdas, and emails Kieron. It keeps the AMIs, disks and IPs, and
    # attaches nothing, so a false alarm costs only the interrupted jobs. Thresholds: per 5 minutes, whole account.
    fast_stop:
      network_out_gib: 1             # sent by instances (normal: a few MiB; 4 capped runners max out at ≈3 GiB)
      lambda_invocations: 1000       # normal: ≈1 a minute (the launcher), plus webhook calls
      log_ingest_mib: 100            # normal: ≈500 bytes per 5 minutes (measured 2026-11-17)
  # Cost Anomaly Detection (free): emails Kieron when a day's spend on any service is unusual by this much.
  anomaly_alert_usd: 3
  block_public_access: [S3 (whole account), AMIs, EBS snapshots]
  ebs_encryption_by_default: true

changes:
