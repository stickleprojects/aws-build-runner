    what: First allow-list, for building the runner; replaces the old claude-assistant-policy v1
    approved: 2026-11-16 Kieron
  - date: 2026-11-16
    what: Every resource Claude creates must carry an approved resource-group tag (first group build-runner); adds AWS Resource Groups
    approved: 2026-11-16 Kieron
  - date: 2026-11-16
    what: Read-only listing becomes Sydney only (was every region); IAM reads stay global, as IAM has no regions
    approved: 2026-11-16 Kieron
  - date: 2026-11-16
    what: "Budget US$25 (≈£20; the ceiling is a £30 bill), counted as what would be billed (credits reduce it, refunds don't). At 100%: AWS Budgets blocks anything new for Claude's user and roles, and the kill switch terminates every instance and deletes the runner AMIs. Claude can't touch the kill switch"
    approved: 2026-11-16 Kieron
  - date: 2026-11-16
