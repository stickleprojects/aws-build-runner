# Guardrails (#42 A): runs part1-godmode/bootstrap-budget-stop.sh from main, in place of CloudShell. It sets up
# the budget stop, the kill switch, the fast-stop alarms and the anomaly alert to match the repo, and ends with
# a dry run of the kill switch. The guardrails-check workflow then confirms everything matches.
#
# The job waits for Kieron's approval (GitHub environment "guardrails"), then signs in by OIDC as
# godmode/aws-build-runner-guardrails (bootstrap-github-apply.sh), which only that environment on main can
# assume. That role can change only the guardrails, by name: never Claude's user or policies, the apply role,
# or itself. Account details are environment secrets, masked in the logs.
name: guardrails
run-name: "guardrails: ${{ inputs.note }}"

on:
  workflow_dispatch:
    inputs:
      note:
        description: "What this run is for (shown as the run title)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: guardrails
  cancel-in-progress: false

jobs:
  # Runs before the approval wait, so the run page shows what you're approving: the most the role can change,
  # and the code this run executes that changed since the last approved run (part1-godmode/release_preview.py).
  describe:
    name: what this run will do
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Summary of the run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NOTE: ${{ inputs.note }}
          ACTOR: ${{ github.actor }}
        run: |
          last=""
          for id in $(gh api "repos/${REPO}/deployments?environment=guardrails&per_page=30" --jq '.[].id'); do
            state="$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=1" --jq '.[0].state')"
            if [[ "$state" == success ]]; then last="$(gh api "repos/${REPO}/deployments/${id}" --jq .sha)"; break; fi
          done
          head="$(git rev-parse HEAD)"
          {
            echo "## guardrails run of \`main\` @ \`${head:0:12}\`, started by ${ACTOR}"
            echo
            echo "> ${NOTE}"
            echo
            python3 -I part1-godmode/release_preview.py --last "$last" --head "$head" \
              --role bootstrap/guardrails-role-policy.json --role-name godmode/aws-build-runner-guardrails \
              part1-godmode/bootstrap-budget-stop.sh part1-godmode/lib.sh part1-godmode/config.py \
              part1-godmode/bootstrap part1-godmode/policy.yaml .github/workflows/guardrails.yml
            echo
            echo "Approve on this page (**Review deployments**) only if this is what you expect."
          } >> "$GITHUB_STEP_SUMMARY"

  guardrails:
    if: github.ref == 'refs/heads/main'
    needs: describe
    runs-on: ubuntu-latest
    environment: guardrails
    timeout-minutes: 20
    permissions:
      id-token: write   # OIDC: sign in to AWS without keys
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_CLAUDE_USER: ${{ secrets.AWS_CLAUDE_USER }}
      AWS_ALERT_EMAIL: ${{ secrets.AWS_ALERT_EMAIL }}
      PYYAML_VERSION: "6.0.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: pip install --quiet "pyyaml==${PYYAML_VERSION}"

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GUARDRAILS_ROLE_ARN }}
          role-session-name: github-guardrails-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Set up the guardrails (bootstrap-budget-stop.sh)
        env:
          NOTE: ${{ inputs.note }}
        run: |
          echo "NOTE: ${NOTE}"
          part1-godmode/bootstrap-budget-stop.sh
