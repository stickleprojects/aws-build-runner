# Apply (or roll back) Claude's AWS policies from GitHub: Actions → apply → Run workflow on main.
# The job waits for Kieron's approval (GitHub environment "aws" or "aws-rollback"), then signs in
# to AWS through OIDC as godmode/aws-build-runner-apply: no stored AWS keys. That role exists only
# after part1-godmode/bootstrap-github-apply.sh (godmode, once) and can do only what these scripts need.
#
# The account id, user name, alert email and role ARN are environment secrets, so they're masked
# in this public repo's logs.
name: apply
run-name: "${{ inputs.action }}: ${{ inputs.note || 'main' }}"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "apply = make AWS match main; rollback = put back the previous policy versions"
        type: choice
        options: [apply, rollback]
        default: apply
      note:
        description: "What this release is for (shown as the run title and in the summary)"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: aws-apply   # never two at once
  cancel-in-progress: false

jobs:
  # Runs before the approval wait, so the run page shows what you're approving.
  describe:
    name: what this ${{ inputs.action }} contains
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Summary of the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ACTION: ${{ inputs.action }}
          NOTE: ${{ inputs.note }}
          ACTOR: ${{ github.actor }}
        run: |
          # The last successful apply = the latest "aws" deployment whose latest status is success.
          last=""
          for id in $(gh api "repos/${REPO}/deployments?environment=aws&per_page=30" --jq '.[].id'); do
            state="$(gh api "repos/${REPO}/deployments/${id}/statuses?per_page=1" --jq '.[0].state')"
            if [[ "$state" == success ]]; then last="$(gh api "repos/${REPO}/deployments/${id}" --jq .sha)"; break; fi
          done
          head="$(git rev-parse HEAD)"
          {
            echo "## ${ACTION} of \`main\` @ \`${head:0:12}\`, started by ${ACTOR}"
            echo
            if [[ -n "$NOTE" ]]; then echo "> ${NOTE}"; echo; fi
            if [[ "$ACTION" == rollback ]]; then
              echo "**Rollback:** each of Claude's policies goes back to its previous IAM version (a policy that was new is"
              echo "detached). AWS will then differ from \`main\` until the change is reverted in git; an issue will say so."
              echo
            fi
            if [[ -z "$last" ]] || ! git cat-file -e "${last}^{commit}" 2>/dev/null; then
              echo "No earlier apply found to compare with."
            elif [[ "$last" == "$head" ]]; then
              echo "\`main\` is what AWS already has (applied at \`${last:0:12}\`)."
            else
              echo "Since the last apply (\`${last:0:12}\`):"
              echo
              # A PR merge commit's body starts with the PR's title.
              for c in $(git rev-list --first-parent "${last}..${head}"); do
                subject="$(git log -1 --format=%s "$c")"
                if [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+) ]]; then
                  echo "- #${BASH_REMATCH[1]} $(git log -1 --format=%b "$c" | head -1)"
                else
                  echo "- ${subject}"
                fi
              done
              echo
              if git diff --quiet "$last" "$head" -- part1-godmode/out; then
                echo "**Claude's permissions: no change.** Tooling or docs only; the policies in AWS stay the same."
              else
                echo "**Claude's permissions change.** POLICY.md, before → after:"
                echo
                echo '```diff'
                git --no-pager diff "$last" "$head" -- part1-godmode/POLICY.md | grep -E '^[-+][^-+]' || true
                echo '```'
              fi
            fi
            echo
            # What the run executes, and the most its role can change (part1-godmode/release_preview.py).
            python3 -I part1-godmode/release_preview.py --last "$last" --head "$head" \
              --role bootstrap/apply-role-policy.json --role-name godmode/aws-build-runner-apply \
              'part1-godmode/*.sh' 'part1-godmode/*.py' part1-godmode/out part1-godmode/policy.yaml \
              .github/workflows/apply.yml
            echo
            echo "Approve on this page (**Review deployments**) only if this is what you expect."
          } >> "$GITHUB_STEP_SUMMARY"

  run:
    name: ${{ inputs.action }}
    needs: describe
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Each environment requires Kieron's approval and accepts main only.
    environment: ${{ inputs.action == 'rollback' && 'aws-rollback' || 'aws' }}
    permissions:
      contents: read
      actions: read       # find the policy CI run and download its artifact
      id-token: write     # OIDC: sign in to AWS without keys
      deployments: write  # rollback: mark the last apply's deployment inactive
      issues: write       # rollback: open a "revert it in git" issue
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_CLAUDE_USER: ${{ secrets.AWS_CLAUDE_USER }}
      AWS_ALERT_EMAIL: ${{ secrets.AWS_ALERT_EMAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML (pinned)
        run: pip install --quiet "pyyaml==6.0.3"

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: github-${{ inputs.action }}-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: part1-godmode
        run: ./apply.sh

      - name: Roll back
        if: inputs.action == 'rollback'
        working-directory: part1-godmode
        run: ./rollback.sh
