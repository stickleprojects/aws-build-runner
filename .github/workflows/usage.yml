# Daily runner usage: hours and estimated cost per class (light / heavy), this month and the last 7 days
# (part2-runner/usage/report.py). Every run writes the job summary; Mondays (or by hand) it also posts it
# to the "Runner usage" issue. When a warning line is crossed it opens an issue assigned to Kieron
# (label budget-alert), keeps it updated, and closes it once things are back under the line.
#
# Read-only in AWS: OIDC as /claude/build-runner-usage (part2-runner/ci/usage-role.sh), which only the
# "usage" environment on main can assume. Account details are environment secrets (masked in logs).
name: usage
run-name: "usage: ${{ github.event_name == 'schedule' && 'daily' || 'by hand' }}"

on:
  schedule:
    - cron: "0 21 * * *"   # 08:00 in Sydney (AEDT; 07:00 in AEST)
  workflow_dispatch:
    inputs:
      post_summary:
        description: "Also post the summary to the Runner usage issue"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: usage
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: usage
    timeout-minutes: 10
    permissions:
      issues: write     # the summary and the warnings
      id-token: write   # OIDC: sign in to AWS without keys
    env:
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}   # only so GitHub masks it in the logs
      GH_TOKEN: ${{ github.token }}
      OWNER: stickleprojects
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_USAGE_ROLE_ARN }}
          role-session-name: github-usage-${{ github.run_id }}
          aws-region: ap-southeast-2

      - name: Usage report
        run: |
          python3 -I part2-runner/usage/report.py "$RUNNER_TEMP/usage"
          cat "$RUNNER_TEMP/usage/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the summary (Mondays, or by hand)
        if: github.event_name == 'schedule' || inputs.post_summary
        run: |
          # The cron fires at 21:00 UTC Sunday for Monday 08:00 in Sydney.
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$(date -u +%a)" != Sun ]]; then echo "not Monday in Sydney"; exit 0; fi
          gh label create runner-usage --color 0e8a16 --description "Weekly runner usage" 2>/dev/null || true
          n="$(gh issue list --label runner-usage --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$n" ]]; then
            n="$(gh issue create --title "Runner usage (weekly)" --label runner-usage \
              --body "Weekly runner usage, posted by the usage workflow. Each comment is one week." | sed 's#.*/##')"
          fi
          gh issue comment "$n" --body-file "$RUNNER_TEMP/usage/summary.md"

      - name: Warnings (open, update or close)
        run: |
          gh label create budget-alert --color d93f0b --description "Runner spend warning (usage workflow)" 2>/dev/null || true
          a="$RUNNER_TEMP/usage/alerts.json"
          for key in heavy budget; do
            label="budget-alert"
            marker="<!-- usage-alert:${key} -->"
            open="$(gh issue list --label "$label" --state open --json number,body \
              --jq "[.[] | select(.body | contains(\"$marker\"))][0].number // empty")"
            alert="$(jq -c --arg k "$key" '.[] | select(.key == $k)' "$a")"
            if [[ -n "$alert" ]]; then
              body="$(jq -r '.body' <<<"$alert")"$'\n\n'"$(cat "$RUNNER_TEMP/usage/summary.md")"$'\n\n'"$marker"
              title="$(jq -r '.title' <<<"$alert")"
              if [[ -n "$open" ]]; then
                gh issue edit "$open" --title "$title" --body "$body"
              else
                gh issue create --title "$title" --label "$label" --assignee "$OWNER" --body "$body"
              fi
            elif [[ -n "$open" ]]; then
              gh issue close "$open" --comment "Back under the warning line: $(head -1 "$RUNNER_TEMP/usage/summary.md" | sed 's/^## //')."
            fi
          done
